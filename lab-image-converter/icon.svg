<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Microscope body -->
  <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Eyepiece -->
    <rect x="52" y="16" width="12" height="10" rx="2" fill="#fff" opacity="0.9"/>
    <!-- Tube -->
    <line x1="58" y1="26" x2="58" y2="52"/>
    <!-- Objective -->
    <rect x="52" y="52" width="12" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <!-- Stage -->
    <line x1="40" y1="66" x2="76" y2="66"/>
    <!-- Arm -->
    <path d="M58 36 L72 36 L72 80" fill="none"/>
    <!-- Base -->
    <line x1="44" y1="80" x2="80" y2="80"/>
    <line x1="62" y1="80" x2="62" y2="88"/>
    <line x1="48" y1="88" x2="76" y2="88"/>
  </g>
  <!-- Arrow -->
  <g fill="#fff" opacity="0.85">
    <polygon points="88,50 98,50 98,44 110,54 98,64 98,58 88,58"/>
  </g>
  <!-- JPG label -->
  <rect x="78" y="92" width="40" height="22" rx="5" fill="#fff" opacity="0.95"/>
  <text x="98" y="108" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">JPG</text>
</svg>
